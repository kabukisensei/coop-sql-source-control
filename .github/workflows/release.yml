name: Release

# Pushing a tag like v1.0.0, or running this workflow by hand with that tag as input,
# builds the CLI package and the SSMS add-in and attaches both to a GitHub Release of
# the tag, so the team installs from one download. Run by hand, it creates the tag on
# the commit it was started from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, like v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        # __version__ in src/coop_sqlsc/__init__.py is the one place the version is
        # written (pyproject.toml reads it); a tag that names another version stops here.
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${TAG#v}"
          ver="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/coop_sqlsc/__init__.py').read_text()).group(1))")"
          echo "tag=$tag  version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag v$tag does not match package version $ver; bump __version__ or retag."
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: dist/*
          if-no-files-found: error

  ssms-vsix:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Build the add-in
        run: msbuild ssms/Extension/CoopSqlSourceControl.Extension.csproj /restore /p:Configuration=Release /v:minimal /nologo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ssms/Extension/bin/Release/*.vsix
          if-no-files-found: error

  release:
    needs: [cli, ssms-vsix]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
      - run: cp ssms/install-ssms.ps1 out/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" out/cli/* out/vsix/*.vsix out/install-ssms.ps1 \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  website:
    # The coop-website sync (its .github/workflows/sync-release.yml, which moves the
    # site's badges, pins and changelog and opens the PR) is a reusable workflow in a
    # PRIVATE repository, and GitHub lets only private repositories call those; this
    # repository is public, so a `uses:` of it fails at planning and no release can
    # start. Until the site repository is public (or the sync is a dispatchable
    # workflow), this job prints the command a person runs in a coop-website clone.
    needs: [cli, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Say how to sync the site
        env:
          VERSION: ${{ needs.cli.outputs.version }}
        run: |
          echo "::warning::sync the site by hand in a coop-website clone:  bash scripts/sync-release.sh coop-sql-source-control $VERSION"
